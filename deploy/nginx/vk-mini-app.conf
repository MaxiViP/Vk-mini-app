upstream vk_mini_app_api {
	server 127.0.0.1:3000;
	keepalive 16;
}

server {
	listen 80;
	server_name example.com;

	root /var/www/vk-mini-app/front/dist;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/javascript
		application/json
		application/xml
		application/rss+xml
		application/vnd.ms-fontobject
		application/wasm
		font/ttf
		font/otf
		font/woff
		font/woff2
		image/svg+xml;

	# Requires nginx built with the Brotli module.
	# If `nginx -t` reports "unknown directive brotli", install the module
	# or comment out the three brotli* directives below; gzip remains enabled.
	brotli on;
	brotli_comp_level 5;
	brotli_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/javascript
		application/json
		application/xml
		application/rss+xml
		application/wasm
		font/ttf
		font/otf
		font/woff
		font/woff2
		image/svg+xml;

	location = /api {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://vk_mini_app_api;
	}

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://vk_mini_app_api;
	}

	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		expires -1;
		try_files $uri =404;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		expires 1y;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		try_files $uri $uri/ /index.html;
	}
}
